<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>geo-mock</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 17rem; margin: 0; padding: .9rem 1rem 1rem;
    font: 13px/1.5 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1rem; margin: 0; }

  /* 開關：checkbox 疊一層 CSS，不引入任何元件庫 */
  .switch { position: relative; width: 2.6rem; height: 1.5rem; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 1rem; background: #bbb;
    transition: background .15s; pointer-events: none;
  }
  .track::after {
    content: ""; position: absolute; top: .15rem; left: .15rem;
    width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #fff;
    transition: transform .15s;
  }
  .switch input:checked ~ .track { background: #2563eb; }
  .switch input:checked ~ .track::after { transform: translateX(1.1rem); }
  .switch input:focus-visible ~ .track { outline: 2px solid #2563eb; outline-offset: 2px; }

  .state { margin: .75rem 0 0; font-weight: 600; }
  .state.on  { color: #157347; }
  .state.off { color: #666; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .6rem; margin: .6rem 0 0; }
  dt { color: #666; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  .note { margin: .8rem 0 0; padding-top: .8rem; border-top: 1px solid #0002; color: #666; }
  footer { margin-top: .7rem; }
  a { color: #2563eb; }
</style>
</head>
<body>
  <header>
    <h1>geo-mock</h1>
    <label class="switch" title="啟用／停用定位覆寫">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>

  <p class="state" id="state">讀取中…</p>

  <dl>
    <dt>緯度</dt><dd id="lat">–</dd>
    <dt>經度</dt><dd id="lng">–</dd>
    <dt>accuracy</dt><dd id="accuracy">–</dd>
  </dl>

  <p class="note" id="note">切換後需重新整理目標分頁才生效。</p>

  <footer><a href="#" id="options">進階設定</a></footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
