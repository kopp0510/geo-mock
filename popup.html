<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>geo-mock</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 20rem; margin: 0; padding: .9rem 1rem 1rem;
    font: 13px/1.5 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1rem; margin: 0; }

  /* 開關：checkbox 疊一層 CSS，不引入任何元件庫 */
  .switch { position: relative; width: 2.6rem; height: 1.5rem; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 1rem; background: #bbb;
    transition: background .15s; pointer-events: none;
  }
  .track::after {
    content: ""; position: absolute; top: .15rem; left: .15rem;
    width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #fff;
    transition: transform .15s;
  }
  .switch input:checked ~ .track { background: #2563eb; }
  .switch input:checked ~ .track::after { transform: translateX(1.1rem); }
  .switch input:focus-visible ~ .track { outline: 2px solid #2563eb; outline-offset: 2px; }

  /* 地址搜尋區 */
  .search { margin: .8rem 0 0; }
  .searchbar { display: flex; gap: .4rem; }
  #q {
    flex: 1; min-width: 0; padding: .4rem .5rem; font: inherit; box-sizing: border-box;
    border: 1px solid #bbb; border-radius: 4px; background: Field; color: FieldText;
  }
  #go {
    flex: none; padding: .4rem .7rem; font: inherit; cursor: pointer;
    border: 0; border-radius: 4px; background: #2563eb; color: #fff;
  }
  #results {
    list-style: none; margin: .4rem 0 0; padding: 0;
    max-height: 11rem; overflow-y: auto;
    border: 1px solid #0002; border-radius: 4px;
  }
  #results li + li { border-top: 1px solid #0001; }
  #results button {
    display: block; width: 100%; padding: .4rem .5rem;
    font: inherit; text-align: left; color: inherit;
    background: none; border: 0; cursor: pointer;
  }
  #results button:hover, #results button:focus-visible { background: #2563eb26; }
  .coord { display: block; color: #666; font-size: .85em; font-variant-numeric: tabular-nums; }
  .msg { margin: .4rem 0 0; min-height: 1.2em; color: #666; }
  .msg.err { color: #c00; }
  /* Nominatim 使用政策要求顯示出處，這行不能拿掉（見 SPEC.md） */
  .attrib { margin: .35rem 0 0; color: #666; font-size: .85em; }

  .state { margin: .75rem 0 0; font-weight: 600; }
  .state.on  { color: #157347; }
  .state.off { color: #666; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .6rem; margin: .6rem 0 0; }
  dt { color: #666; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  .note { margin: .8rem 0 0; padding-top: .8rem; border-top: 1px solid #0002; color: #666; }
  footer { margin-top: .7rem; }
  a { color: #2563eb; }

  /* #666 在深色底上約 3:1，低於一般文字的 4.5:1。options.html 同樣處理。 */
  @media (prefers-color-scheme: dark) {
    dt, .note, .state.off, .coord, .msg, .attrib { color: #a8a8a8; }
  }
</style>
</head>
<body>
  <header>
    <h1>geo-mock</h1>
    <label class="switch" title="啟用／停用定位覆寫">
      <input type="checkbox" id="enabled" aria-label="啟用／停用定位覆寫" disabled>
      <span class="track"></span>
    </label>
  </header>

  <div class="search">
    <div class="searchbar">
      <input id="q" type="search" placeholder="地址或地標，按 Enter 搜尋"
             autocomplete="off" spellcheck="false" aria-label="搜尋地址或地標">
      <button type="button" id="go">搜尋</button>
    </div>
    <ul id="results" hidden></ul>
    <p class="msg" id="msg" role="status"></p>
    <p class="attrib">地址資料來源：<a href="https://www.openstreetmap.org/copyright"
      target="_blank" rel="noreferrer">OpenStreetMap</a></p>
  </div>

  <p class="state" id="state" role="status">讀取中…</p>

  <dl>
    <dt>緯度</dt><dd id="lat">–</dd>
    <dt>經度</dt><dd id="lng">–</dd>
    <dt>accuracy</dt><dd id="accuracy">–</dd>
  </dl>

  <p class="note" id="note">切換後需重新整理目標分頁才生效。</p>

  <footer><a href="#" id="options">進階設定</a></footer>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
