<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>geo-mock iframe 測試</title>
<style>
  body { font: 13px/1.5 -apple-system, "PingFang TC", sans-serif; margin: .6rem; }
  pre { background: #f4f4f4; padding: .4rem; margin: .3rem 0 0; }
</style>
</head>
<body>
  <strong>iframe 內</strong>
  <pre id="out">定位中…</pre>
<script>
// 這頁只會被 test.html 用 iframe 嵌進去，用來驗 all_frames 有沒有生效。
// 跟 test.html 一樣只呼叫 navigator.geolocation，完全不查 IP。
const out = document.getElementById('out');
// 不往 window 上掛結果：verify.js 驗這個 frame 的方式是在裡面**重新呼叫**一次
// 定位（比讀一個載入當下的快照可靠），掛了也沒人讀，只會讓下一個人以為
// 有斷言在看它。畫面上這行字才是給人看的。
navigator.geolocation.getCurrentPosition(
  p => { out.textContent = `${p.coords.latitude}, ${p.coords.longitude}`; },
  e => { out.textContent = 'error code=' + e.code; },
  { timeout: 5000 }
);
</script>
</body>
</html>
