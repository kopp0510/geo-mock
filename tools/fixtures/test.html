<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>geo-mock 測試頁</title>
<script>
// ── 這段必須留在 <head> 最頂端 ──────────────────────────────
// 模擬「頁面比 chrome.storage 非同步讀取更早要定位」。inject.js 是 document_start，
// 覆寫一定已就位；但 bridge.js 的設定此刻多半還沒送到，走的正是 pending 佇列
// 那條路（CLAUDE.md 陷阱 1）。tools/verify.js 的第 5 項斷言讀的就是 window.__early。
window.__early = null; window.__earlyErr = null;
const t0 = Date.now();
navigator.geolocation.getCurrentPosition(
  p => { window.__early = { lat: p.coords.latitude, lng: p.coords.longitude,
                            ms: Date.now() - t0 }; },
  e => { window.__earlyErr = 'code=' + e.code + ' ' + e.message; }
);

// permissions.query 也有同一條排隊路徑（設定未到時晚點才 resolve），
// 但它沒有對應的早期呼叫就永遠測不到 —— 第 4 項斷言在設定早就到齊之後才跑，
// 走的是快速路徑。這一發補上那個缺口。
window.__earlyPerm = null;
navigator.permissions.query({ name: 'geolocation' })
  .then(s => { window.__earlyPerm = s.state; })
  .catch(e => { window.__earlyPerm = 'error:' + e.name; });
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.6 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
    max-width: 34rem; margin: 3rem auto; padding: 0 1.5rem;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  .sub { color: #666; margin: 0 0 1.5rem; }
  button { padding: .5rem 1.25rem; font: inherit; cursor: pointer;
           border: 0; border-radius: 4px; background: #2563eb; color: #fff; }
  pre { padding: .9rem 1rem; border-radius: 6px; background: #8881;
        overflow-x: auto; margin: 1rem 0 0; }
  .ok  { color: #157347; font-weight: 600; }
  .err { color: #c00; font-weight: 600; }
  footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #8883;
           color: #666; font-size: .9em; }
  @media (prefers-color-scheme: dark) { .sub, footer { color: #a8a8a8; } }
</style>
</head>
<body>
  <h1>geo-mock 測試頁</h1>
  <p class="sub">這頁只呼叫 <code>navigator.geolocation</code>，<strong>完全不查 IP</strong>。
     所以顯示什麼座標，就是瀏覽器實際回報給網站的座標。</p>

  <button id="again">重新定位</button>

  <!-- all_frames 的驗證對象。iframe 裡的頁面有自己的 JS 環境，
       content script 沒設 all_frames 的話它不會被注入。 -->
  <!-- 沒有 src 的 frame：內容用 srcdoc 塞。all_frames 管不到這種，
       要 match_about_blank 才會被注入（widget 與部分地圖 SDK 就是這樣建 iframe 的）。 -->
  <iframe id="blankFrame" title="about:blank iframe 測試"
          style="width: 100%; height: 3.5rem; border: 1px dashed #ccc; margin-top: .5rem"
          srcdoc="&lt;body style='font:12px sans-serif;margin:.4rem'&gt;srcdoc frame:
            &lt;span id='o'&gt;定位中…&lt;/span&gt;
            &lt;script&gt;navigator.geolocation.getCurrentPosition(
              p =&gt; { window.__blankPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                     document.getElementById('o').textContent = window.__blankPos.lat; },
              e =&gt; { document.getElementById('o').textContent = 'error ' + e.code; },
              { timeout: 5000 });&lt;/script&gt;&lt;/body&gt;"></iframe>

  <iframe id="frame" src="frame.html" title="iframe 測試"
          style="width: 100%; height: 5.5rem; border: 1px solid #ccc; margin-top: .8rem"></iframe>
  <pre id="out">定位中…</pre>

  <footer>
    看到設定的座標 = 覆寫生效。看到錯誤或你的真實位置 = 沒生效或開關是關的。<br>
    切換 popup 開關或改座標之後，要<strong>重新整理這一頁</strong>才會反映
    —— 設定即時推送尚未實作。
  </footer>

<script>
const out = document.getElementById('out');

function show(text, cls) {
  out.textContent = text;
  out.className = cls || '';
}

function locate() {
  show('定位中…');
  const t = Date.now();
  navigator.geolocation.getCurrentPosition(
    p => show(
      '緯度      ' + p.coords.latitude + '\n' +
      '經度      ' + p.coords.longitude + '\n' +
      'accuracy  ' + p.coords.accuracy + ' m\n' +
      '耗時      ' + (Date.now() - t) + ' ms\n' +
      '時間戳    ' + new Date(p.timestamp).toLocaleString(), 'ok'),
    e => show('定位失敗\ncode=' + e.code + '  ' + e.message +
              '\n耗時 ' + (Date.now() - t) + ' ms', 'err'),
    { timeout: 10000 }
  );
}

document.getElementById('again').addEventListener('click', locate);
locate();
</script>
</body>
</html>
