# 在真的 Windows / macOS 上驗這套能不能跑，然後打包成單一執行檔。
#
# 兩件事一起做的理由：打包出來的東西要能自己跑驗證（`launch.py` 帶參數就走 CLI），
# 不然「打包壞掉」只能靠人雙擊才發現。
name: Build & verify

on:
  push:
    branches: [main]
    tags: ['v*']          # 打 tag 就發一版到 Releases
  workflow_dispatch:

jobs:
  # 從原始碼驗一次。這是「程式對不對」的關卡，跟打包無關。
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 裝相依
        run: uv sync

      - name: detect
        run: uv run python -m gpssim.cli detect

      - name: Milestone 1（navigator.geolocation）
        run: uv run python -m gpssim.cli test --coords "25.033964, 121.564468"

      - name: Milestone 2（Google Maps）
        run: uv run python -m gpssim.cli maps --coords "25.033964, 121.564468"

      - name: 收拾乾淨了嗎
        if: always()
        shell: pwsh
        run: |
          $left = Get-Process chrome -ErrorAction SilentlyContinue
          if ($left) { Write-Host "::warning::還有 $($left.Count) 個 chrome 程序沒收掉" }
          else { Write-Host "沒有殘留的 chrome 程序" }
          $profiles = Get-ChildItem $env:TEMP -Filter "gpssim-*" -Directory -ErrorAction SilentlyContinue
          if ($profiles) { Write-Host "::warning::還有 $($profiles.Count) 個 temp profile 沒刪" }
          else { Write-Host "沒有殘留的 temp profile" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: .screenshots/
          if-no-files-found: warn

  build-windows:
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 25
    # 預設的 GITHUB_TOKEN 是唯讀的，少了這行建 release 會 403
    # 「Resource not accessible by integration」。踩過一次。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 打包
        shell: pwsh
        run: |
          # --windowed：雙擊時不要跳出黑色終端機視窗
          # --add-data：測試頁是執行時要讀的檔案，不打包進去 Milestone 1 會失敗
          #             （Windows 的分隔符號是分號，不是冒號）
          uv run --extra gui --with pyinstaller pyinstaller `
            --onefile --windowed --noconfirm `
            --name "GPS-Simulator" `
            --add-data "gpssim/testpage;gpssim/testpage" `
            launch.py

      # 用打包出來的執行檔跑真正的驗證 —— 這才測得到資源檔有沒有被打包進去
      - name: 打包版自我驗證
        shell: pwsh
        run: |
          $exe = "dist\GPS-Simulator.exe"
          if (-not (Test-Path $exe)) { throw "沒有產出 $exe" }
          Write-Host "產出 $exe（$([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB）"
          & $exe detect
          if ($LASTEXITCODE -ne 0) { throw "打包版 detect 失敗" }
          & $exe maps --coords "25.033964, 121.564468"
          if ($LASTEXITCODE -ne 0) { throw "打包版 maps 失敗" }

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Simulator-windows
          path: dist/GPS-Simulator.exe
          if-no-files-found: error

      - name: 發布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GPS-Simulator.exe
          generate_release_notes: true
          body_path: .github/release-notes.md

  build-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 與 Intel 要各打一份 —— PySide6 的 wheel 是分架構的，
          # 在 arm64 上打出來的東西 Intel Mac 跑不動。
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: intel

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 打包
        run: |
          uv run --extra gui --with pyinstaller pyinstaller \
            --onefile --windowed --noconfirm \
            --name "GPS-Simulator" \
            --add-data "gpssim/testpage:gpssim/testpage" \
            launch.py

      - name: 打包版自我驗證
        run: |
          ls -lh dist/
          ./dist/GPS-Simulator detect
          ./dist/GPS-Simulator maps --coords "25.033964, 121.564468"

      # .app 是資料夾，要壓起來才傳得動，也才保得住執行權限
      - name: 壓成 zip
        run: |
          ditto -c -k --keepParent dist/GPS-Simulator.app \
            "GPS-Simulator-macos-${{ matrix.arch }}.zip"
          ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Simulator-macos-${{ matrix.arch }}
          path: GPS-Simulator-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: 發布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GPS-Simulator-macos-${{ matrix.arch }}.zip
          generate_release_notes: true
          body_path: .github/release-notes.md
