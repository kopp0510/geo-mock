# 在真的 Windows / macOS 上驗這套能不能跑，然後把 Windows 版打包成單一執行檔。
#
# 打包與驗證一起做的理由：打包出來的東西要能自己跑驗證（`launch.py` 帶參數就走 CLI），
# 不然「打包壞掉」只能靠人雙擊才發現。
#
# **macOS 只驗、不打包**（2026-09-01 起）。未簽章的 .app 下載後會被 Gatekeeper 擋
# （「Apple 無法檢查是否包含惡意軟體」），要解除得付 Apple Developer Program 的年費
# 做公證 —— 發一個多數人打不開的檔案沒有意義。Mac 使用者改從原始碼跑。
name: Build & verify

on:
  push:
    branches: [main]      # 只驗程式碼
    tags: ['v*']          # 驗 + 打包 + 發一版到 Releases
  workflow_dispatch:

# 同一個 ref 連續推的話，舊的那輪直接取消，不要排隊佔 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 從原始碼驗一次。這是「程式對不對」的關卡，跟打包無關。
  #
  # Windows 與 macOS 都跑。macOS 沒有打包 job，所以**這裡是 macOS 唯一的驗證關卡** ——
  # 拿掉的話這套程式在 macOS 上就完全沒有 CI 把關了。
  smoke:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      # 一邊 flake（Chrome 沒起來之類）不要順手把另一邊也取消掉
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 裝相依
        run: uv sync

      - name: detect
        run: uv run python -m gpssim.cli detect

      - name: Milestone 1（navigator.geolocation）
        run: uv run python -m gpssim.cli test --coords "25.033964, 121.564468"

      - name: Milestone 2（Google Maps）
        run: uv run python -m gpssim.cli maps --coords "25.033964, 121.564468"

      - name: 收拾乾淨了嗎（Windows）
        if: always() && matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $left = Get-Process chrome -ErrorAction SilentlyContinue
          if ($left) { Write-Host "::warning::還有 $($left.Count) 個 chrome 程序沒收掉" }
          else { Write-Host "沒有殘留的 chrome 程序" }
          $profiles = Get-ChildItem $env:TEMP -Filter "gpssim-*" -Directory -ErrorAction SilentlyContinue
          if ($profiles) { Write-Host "::warning::還有 $($profiles.Count) 個 temp profile 沒刪" }
          else { Write-Host "沒有殘留的 temp profile" }

      # macOS 上不能用「有沒有 chrome 程序」判斷 —— runner 上可能有別的 Chrome。
      # 只認自己開的：profile 路徑帶 gpssim- 前綴的那些。
      - name: 收拾乾淨了嗎（macOS）
        if: always() && matrix.runner != 'windows-latest'
        run: |
          # 兩個 `|| true` 不能省。Actions 的預設 shell 是 `bash -e -o pipefail`，
          # 而 **pgrep / find 找不到東西時 exit 1** —— 也就是「乾淨」這個正常結果
          # 會讓命令替換回非零，被 set -e 當成錯誤直接中斷，一行都不印就把 job 判紅。
          # 實測過：沒有 `|| true` 時這個步驟必定失敗（exit 1）。
          left=$(pgrep -f 'user-data-dir=.*gpssim-' | wc -l | tr -d ' ') || true
          if [ "$left" != "0" ]; then echo "::warning::還有 $left 個 chrome 程序沒收掉"
          else echo "沒有殘留的 chrome 程序"; fi
          profiles=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'gpssim-*' -type d 2>/dev/null | wc -l | tr -d ' ') || true
          if [ "$profiles" != "0" ]; then echo "::warning::還有 $profiles 個 temp profile 沒刪"
          else echo "沒有殘留的 temp profile"; fi

      # artifact 名稱一定要帶 runner —— upload-artifact@v4 對重名是直接報 409 失敗，
      # 不是覆蓋。matrix 兩條腿共用一個名字會讓整輪 CI 紅在最後一步。
      # 用 matrix.runner 而不是 runner.os：前者是自己在上面寫死的值，不必賭 context 的拼法。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: .screenshots/
          if-no-files-found: warn

  # **只在打 tag 時跑。** 推 main 也打包的話，一次發版會跑兩輪完全一樣的
  # 打包（推 main 一次、推 tag 一次），白跑一遍。
  # 代價是打包壞掉要到打 tag 才發現 —— 但那時自我驗證會擋下發布，
  # 修完重打一個 tag 就好，不會有壞檔案流出去。
  build-windows:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 25
    # 預設的 GITHUB_TOKEN 是唯讀的，少了這行建 release 會 403
    # 「Resource not accessible by integration」。踩過一次。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 版本號的唯一來源是 git tag。原始碼裡固定是 0.0.0+dev，
      # 拿到執行檔的人一眼看得出「這不是 Releases 上的正式版」。
      - name: 從 tag 寫入版本號
        run: uv run python set_version.py ${{ github.ref_name }}

      - name: 打包
        shell: pwsh
        run: |
          # --windowed：雙擊時不要跳出黑色終端機視窗
          # --add-data：測試頁是執行時要讀的檔案，不打包進去 Milestone 1 會失敗
          #             （Windows 的分隔符號是分號，不是冒號）
          uv run --extra gui --with pyinstaller pyinstaller `
            --onefile --windowed --noconfirm `
            --name "GPS-Simulator" `
            --add-data "gpssim/testpage;gpssim/testpage" `
            launch.py

      # 用打包出來的執行檔跑真正的驗證 —— 這才測得到資源檔有沒有被打包進去
      - name: 打包版自我驗證
        shell: pwsh
        run: |
          $exe = "dist\GPS-Simulator.exe"
          if (-not (Test-Path $exe)) { throw "沒有產出 $exe" }
          Write-Host "產出 $exe（$([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB）"
          # --windowed 的 exe 是 GUI 子系統：沒有主控台（看不到輸出），
          # 而且 **PowerShell 的 `&` 不會等它結束就返回**，$LASTEXITCODE 是空的。
          # 踩過一次，錯誤訊息長這樣：「打包版 detect 失敗（exit ）」。
          # 要拿 exit code 只能用 Start-Process -Wait -PassThru。
          function Invoke-Packaged([string[]]$Arguments) {
            $p = Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -PassThru
            return $p.ExitCode
          }
          # 用 --lat / --lng 而不是 --coords："25.033964, 121.564468" 裡有空格，
          # Start-Process 會把它拆成兩個參數，程式收到殘缺的座標回 exit 2。
          # 踩過一次，訊息是「打包版 maps 失敗（exit 2）」——2 是「座標無效」。
          $code = Invoke-Packaged @("detect")
          if ($code -ne 0) { throw "打包版 detect 失敗（exit $code）" }
          $code = Invoke-Packaged @("maps", "--lat", "25.033964", "--lng", "121.564468")
          if ($code -ne 0) { throw "打包版 maps 失敗（exit $code）" }
          Write-Host "打包版 detect 與 maps 都回 0"

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Simulator-windows
          path: dist/GPS-Simulator.exe
          if-no-files-found: error

      - name: 發布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GPS-Simulator.exe
          generate_release_notes: true
          body_path: .github/release-notes.md
