<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>geo-mock 設定</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.6 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
    max-width: 30rem; margin: 2rem auto; padding: 0 1.5rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: #666; margin: 0 0 1.75rem; }
  label { display: block; margin-bottom: 1rem; }
  .name { display: block; margin-bottom: .25rem; font-weight: 600; }
  .hint { display: block; color: #666; font-weight: 400; font-size: .85em; }
  input {
    width: 100%; padding: .5rem; font: inherit; box-sizing: border-box;
    border: 1px solid #bbb; border-radius: 4px; background: Field; color: FieldText;
  }
  input:invalid { border-color: #c00; }
  button {
    padding: .5rem 1.25rem; font: inherit; cursor: pointer;
    border: 0; border-radius: 4px; background: #2563eb; color: #fff;
  }
  #status { margin-left: .75rem; }
  #status.ok { color: #157347; }
  #status.err { color: #c00; }
  footer { margin-top: 2rem; color: #666; font-size: .9em; }

  /* #666 在深色底上約 3:1，低於一般文字的 4.5:1。popup.html 同樣處理。 */
  @media (prefers-color-scheme: dark) {
    .sub, .hint, footer { color: #a8a8a8; }
  }
</style>
</head>
<body>
  <h1>geo-mock 設定</h1>
  <p class="sub">這裡設定回報給網站的座標。存檔即時生效，不必重新整理分頁 ——
    但頁面要再呼叫一次定位才看得到，已經抓過位置的頁面不會自己更新。</p>

  <form id="form">
    <label>
      <span class="name">貼上座標<span class="hint">從 Google Maps 右鍵複製的那一串，例如
        24.262246621321527, 120.62450392661896 —— 會自動拆進下面兩欄</span></span>
      <input id="paste" type="text" placeholder="緯度, 經度" autocomplete="off" spellcheck="false">
    </label>
    <label>
      <span class="name">緯度 latitude<span class="hint">-90 ～ 90</span></span>
      <input id="lat" type="number" step="any" min="-90" max="90" required>
    </label>
    <label>
      <span class="name">經度 longitude<span class="hint">-180 ～ 180</span></span>
      <input id="lng" type="number" step="any" min="-180" max="180" required>
    </label>
    <label>
      <span class="name">accuracy<span class="hint">公尺，回報給網站的定位誤差半徑</span></span>
      <input id="accuracy" type="number" step="any" min="0" required>
    </label>
    <label>
      <span class="name">抖動半徑<span class="hint">公尺。抖動模式下以上面的座標為中心，
        每次定位在這個半徑內隨機取一點</span></span>
      <input id="jitterRadius" type="number" step="any" min="0" required>
    </label>
    <button type="submit">儲存</button><span id="status" role="status"></span>
  </form>

  <footer>
    altitude、heading、speed 等欄位尚未實作（見 SPEC.md 第三版）。
    模式切換（固定／抖動）在 popup。
  </footer>

  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
