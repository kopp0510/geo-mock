<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title data-i18n="optionsTitle">geo-mock 設定</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.6 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif;
    max-width: 30rem; margin: 2rem auto; padding: 0 1.5rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: #666; margin: 0 0 1.75rem; }
  label { display: block; margin-bottom: 1rem; }
  .name { display: block; font-weight: 600; }
  .hint { display: block; margin-bottom: .25rem; color: #666; font-weight: 400; font-size: .85em; }
  input {
    width: 100%; padding: .5rem; font: inherit; box-sizing: border-box;
    border: 1px solid #bbb; border-radius: 4px; background: Field; color: FieldText;
  }
  input:invalid { border-color: #c00; }
  button {
    padding: .5rem 1.25rem; font: inherit; cursor: pointer;
    border: 0; border-radius: 4px; background: #2563eb; color: #fff;
  }
  #status { margin-left: .75rem; }
  #status.ok { color: #157347; }
  #status.err { color: #c00; }
  footer { margin-top: 2rem; color: #666; font-size: .9em; }

  /* 排除清單 */
  .sites { margin-bottom: 1rem; }
  #siteList { list-style: none; margin: 0 0 .5rem; padding: 0; }
  #siteList li {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; padding: .3rem .1rem .3rem .5rem;
    border: 1px solid #0002; border-radius: 4px; margin-bottom: .3rem;
  }
  #siteList code { font: inherit; font-family: ui-monospace, monospace; }
  #siteList button {
    font: inherit; padding: .1rem .5rem; cursor: pointer;
    background: none; border: 0; color: #999;
  }
  #siteList button:hover { color: #c00; }
  .siterow { display: flex; gap: .4rem; }
  #siteInput { flex: 1; min-width: 0; }
  #addSite { flex: none; background: #0001; color: inherit; }
  .empty { color: #666; font-size: .9em; margin: 0 0 .5rem; }

  /* #666 在深色底上約 3:1，低於一般文字的 4.5:1。popup.html 同樣處理。 */
  @media (prefers-color-scheme: dark) {
    .sub, .hint, footer, .empty { color: #a8a8a8; }
    #siteList button { color: #888; }
  }
</style>
</head>
<body>
  <h1 data-i18n="optionsTitle">geo-mock 設定</h1>
  <p class="sub" data-i18n="optionsSub">這裡設定回報給網站的座標。</p>

  <form id="form">
    <label>
      <span class="name" data-i18n="pasteName">貼上座標</span>
      <span class="hint" data-i18n="pasteHint">從 Google Maps 右鍵複製的那一串</span>
      <input id="paste" type="text" autocomplete="off" spellcheck="false"
             data-i18n-attr="placeholder:pastePlaceholder">
    </label>
    <label>
      <span class="name" data-i18n="latName">緯度 latitude</span>
      <span class="hint" data-i18n="latHint">-90 ～ 90</span>
      <input id="lat" type="number" step="any" min="-90" max="90" required>
    </label>
    <label>
      <span class="name" data-i18n="lngName">經度 longitude</span>
      <span class="hint" data-i18n="lngHint">-180 ～ 180</span>
      <input id="lng" type="number" step="any" min="-180" max="180" required>
    </label>
    <label>
      <span class="name" data-i18n="accuracyName">accuracy</span>
      <span class="hint" data-i18n="accuracyHint">公尺，回報給網站的定位誤差半徑</span>
      <input id="accuracy" type="number" step="any" min="0" required>
    </label>
    <label>
      <span class="name" data-i18n="radiusName">抖動半徑</span>
      <!-- 這一行帶參數（上限值），apply() 填不了，由 options.js 補 -->
      <span class="hint" id="radiusHint">公尺</span><!-- 帶參數，由 options.js 填 -->
      <input id="jitterRadius" type="number" step="any" min="0" max="100000" required>
    </label>
    <button type="submit" data-i18n="saveButton">儲存</button><span id="status" role="status"></span>
  </form>

  <div class="sites">
    <span class="name" data-i18n="excludedName">不覆寫的網站</span>
    <span class="hint" data-i18n="excludedHint">列在這裡的網站走真實定位。</span>
    <p class="empty" id="sitesEmpty" data-i18n="excludedEmpty">目前沒有排除任何網站</p>
    <ul id="siteList"></ul>
    <div class="siterow">
      <input id="siteInput" type="text" autocomplete="off" spellcheck="false"
             data-i18n-attr="placeholder:sitePlaceholder">
      <button type="button" id="addSite" data-i18n="addSite">新增</button>
    </div>
  </div>

  <footer data-i18n="optionsFooter">altitude、heading、speed 等欄位尚未實作。</footer>

  <script src="defaults.js"></script>
  <script src="sites.js"></script>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
